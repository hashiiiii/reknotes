name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - development
          - production

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.environment != 'production' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # The container driver is required for the GitHub Actions cache backend.
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # OCI tags cannot contain the slashes used in branch names.
      - name: Compute image tag
        id: image
        run: echo "tag=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build OAuth2 Proxy image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile.oauth2-proxy
          push: true
          tags: ghcr.io/${{ github.repository }}:oauth2-proxy-${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=oauth2-proxy
          cache-to: type=gha,scope=oauth2-proxy,mode=max

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install packages
        run: bun install --frozen-lockfile

      # Migrations do not construct the embedding or backup providers.
      - name: Run migration
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          DEPLOYMENT: remote
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
        run: bun run migrate --apply

      - name: Deploy to VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
          ENVIRONMENT: ${{ inputs.environment }}
          DEPLOYMENT: remote
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          DOMAIN: ${{ secrets.DOMAIN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          BACKUP_S3_BUCKET_NAME: ${{ secrets.BACKUP_S3_BUCKET_NAME }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OAUTH2_PROXY_CLIENT_ID: ${{ secrets.OAUTH2_PROXY_CLIENT_ID }}
          OAUTH2_PROXY_CLIENT_SECRET: ${{ secrets.OAUTH2_PROXY_CLIENT_SECRET }}
          OAUTH2_PROXY_COOKIE_SECRET: ${{ secrets.OAUTH2_PROXY_COOKIE_SECRET }}
          OAUTH2_PROXY_GITHUB_USERS: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          umask 077
          : "${VM_HOST:?Set VM_HOST}"
          : "${VM_SSH_KEY:?Set VM_SSH_KEY}"
          : "${VM_SSH_KNOWN_HOSTS:?Set VM_SSH_KNOWN_HOSTS from a trusted connection}"
          deploy_dir=$(mktemp -d)
          trap 'rm -rf "$deploy_dir"' EXIT
          printf '%s\n' "$VM_SSH_KEY" > "$deploy_dir/deploy_key"
          printf '%s\n' "$VM_SSH_KNOWN_HOSTS" > "$deploy_dir/known_hosts"

          # Compose and Bun parse quoted dotenv values differently. Compose gets
          # literal dotenv values; host commands source Bash-escaped exports.
          while IFS= read -r key; do
            value=${!key}
            printf 'export %s=%q\n' "$key" "$value" >> "$deploy_dir/.env.sh"
            value=${value//\'/\\\'}
            printf "%s='%s'\n" "$key" "$value" >> "$deploy_dir/.env"
          done <<'KEYS'
          ENVIRONMENT
          DEPLOYMENT
          IMAGE_TAG
          DOMAIN
          GITHUB_REPOSITORY
          DATABASE_URL
          S3_ENDPOINT
          S3_ACCESS_KEY_ID
          S3_SECRET_ACCESS_KEY
          S3_BUCKET_NAME
          BACKUP_S3_BUCKET_NAME
          BACKUP_S3_ENDPOINT
          BACKUP_S3_ACCESS_KEY_ID
          BACKUP_S3_SECRET_ACCESS_KEY
          CLOUDFLARE_ACCOUNT_ID
          CLOUDFLARE_API_TOKEN
          OAUTH2_PROXY_CLIENT_ID
          OAUTH2_PROXY_CLIENT_SECRET
          OAUTH2_PROXY_COOKIE_SECRET
          OAUTH2_PROXY_GITHUB_USERS
          KEYS

          ssh_options=(-i "$deploy_dir/deploy_key" -o "UserKnownHostsFile=$deploy_dir/known_hosts" -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o BatchMode=yes)
          scp "${ssh_options[@]}" "$deploy_dir/.env" "ubuntu@$VM_HOST:~/reknotes/.env.next"
          scp "${ssh_options[@]}" "$deploy_dir/.env.sh" "ubuntu@$VM_HOST:~/reknotes/.env.sh.next"
          ssh "${ssh_options[@]}" "ubuntu@$VM_HOST" '
            set -eu
            cd ~/reknotes
            chmod 600 .env.next .env.sh.next
            mv .env.sh.next .env.sh
            mv .env.next .env
            git pull --ff-only
            docker compose -f compose.remote.yaml pull
            docker compose -f compose.remote.yaml up -d --remove-orphans
            docker image prune -f
          '
