name: CI

on:
  pull_request:

# loadConfig が要求する共通変数のみ。Cloudflare / backup / oauth2-proxy の変数は
# 使うコマンドでしか検証されないので、テストと migrate にダミー値は不要。
env:
  ENVIRONMENT: test
  DEPLOYMENT: local
  DATABASE_URL: postgresql://reknotes:reknotes@localhost:5432
  S3_ENDPOINT: dummy
  S3_ACCESS_KEY_ID: dummy
  S3_SECRET_ACCESS_KEY: dummy
  S3_BUCKET_NAME: reknotes-test

jobs:
  test:
    runs-on: ubuntu-latest
    services: &postgres-service
      postgres:
        image: postgres:18@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
        env:
          POSTGRES_USER: reknotes
          POSTGRES_PASSWORD: reknotes
          POSTGRES_DB: reknotes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U reknotes"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install packages
        run: bun install --frozen-lockfile

      - name: Run migrations
        run: bun run migrate --apply

      - name: Run tests
        run: bun test

  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install packages
        run: bun install --frozen-lockfile

      - name: Run lint & typecheck
        run: bun run check

      - name: Run build
        run: bun run build

  destructive-check:
    runs-on: ubuntu-latest
    services: *postgres-service
    # この job は base ブランチのコードでも migrate を実行する。base がこの refactor より
    # 古い間は旧 loadConfig が CLOUDFLARE_* / BACKUP_S3_* を無条件に要求するので、
    # ダミー値を job スコープで残す。base が追いついたら削除してよい。
    env:
      CLOUDFLARE_ACCOUNT_ID: dummy
      CLOUDFLARE_API_TOKEN: dummy
      BACKUP_S3_ENDPOINT: dummy
      BACKUP_S3_ACCESS_KEY_ID: dummy
      BACKUP_S3_SECRET_ACCESS_KEY: dummy
      BACKUP_S3_BUCKET_NAME: reknotes-backup-test
    steps:
      - uses: actions/checkout@v7
        with:
          # feature と base とでブランチを行き来するため全履歴を取得しておく
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Apply base branch schema to plain DB
        run: |
          git checkout origin/${{ github.base_ref }}
          bun install --frozen-lockfile
          bun run migrate --apply

      - name: Detect destructive diff against base branch
        run: |
          git checkout -
          bun install --frozen-lockfile
          bun run migrate --check
