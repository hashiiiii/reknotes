name: CI

on:
  pull_request:

permissions:
  contents: read

# The CPU runtime ships in the package. CI does not need the optional CUDA download.
env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Set up local services and databases
        run: bun run setup

      - name: Run tests
        run: bun run test

      - name: Back up the local database to object storage
        run: bun run dump

  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install packages
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit

      - name: Run lint & typecheck
        run: bun run check

      - name: Run build
        run: bun run build

      - name: Build application image
        run: docker build .

      - name: Build OAuth2 Proxy image
        run: docker build -f Dockerfile.oauth2-proxy .

  destructive-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.7@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
        env:
          POSTGRES_USER: reknotes
          POSTGRES_PASSWORD: reknotes
          POSTGRES_DB: reknotes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U reknotes"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      ENVIRONMENT: test
      DEPLOYMENT: local
      DATABASE_URL: postgresql://reknotes:reknotes@localhost:5432
      S3_ENDPOINT: dummy
      S3_ACCESS_KEY_ID: dummy
      S3_SECRET_ACCESS_KEY: dummy
      S3_BUCKET_NAME: reknotes-test
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Both commits are needed to compare schemas against the exact PR base.
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Apply base branch schema to plain DB
        run: |
          git checkout --detach "$BASE_SHA"
          bun install --frozen-lockfile
          bun run migrate --apply

      - name: Detect destructive diff against base branch
        run: |
          git checkout -
          bun install --frozen-lockfile
          bun run migrate --check
