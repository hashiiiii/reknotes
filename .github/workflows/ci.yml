name: CI

on:
  pull_request:

# loadConfig が要求する共通変数のみ。Cloudflare / backup / oauth2-proxy の変数は
# 使うコマンドでしか検証されないので、テストと migrate にダミー値は不要。
env:
  ENVIRONMENT: test
  DEPLOYMENT: local
  DATABASE_URL: postgresql://reknotes:reknotes@localhost:5432
  S3_ENDPOINT: dummy
  S3_ACCESS_KEY_ID: dummy
  S3_SECRET_ACCESS_KEY: dummy
  S3_BUCKET_NAME: reknotes-test

jobs:
  test:
    runs-on: ubuntu-latest
    services: &postgres-service
      postgres:
        image: postgres:18@sha256:8ff36f3c66371cba71d20ceedccfc3de9669a68737607888c4ef0af93abe8e39
        env:
          POSTGRES_USER: reknotes
          POSTGRES_PASSWORD: reknotes
          POSTGRES_DB: reknotes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U reknotes"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.13"

      - name: Install packages
        run: bun install --frozen-lockfile

      - name: Run migrations
        run: bun run migrate --apply

      - name: Run tests
        run: bun test

  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.13"

      - name: Install packages
        run: bun install --frozen-lockfile

      - name: Run lint & typecheck
        run: bun run check

      - name: Run build
        run: bun run build

  destructive-check:
    runs-on: ubuntu-latest
    services: *postgres-service
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # feature と base とでブランチを行き来するため全履歴を取得しておく
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.13"

      - name: Apply base branch schema to plain DB
        run: |
          git checkout origin/${{ github.base_ref }}
          bun install --frozen-lockfile
          bun run migrate --apply

      - name: Detect destructive diff against base branch
        run: |
          git checkout -
          bun install --frozen-lockfile
          bun run migrate --check
