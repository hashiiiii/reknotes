services:
  postgres:
    image: postgres:18.7@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
    environment:
      POSTGRES_USER: reknotes
      POSTGRES_PASSWORD: reknotes
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "reknotes", "-d", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  minio:
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z-distroless@sha256:a72e17773bdeb151999f9bf9d3bd842fb03850a577b730ab8c63343bb1f468fd
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  minio-backup:
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z-distroless@sha256:a72e17773bdeb151999f9bf9d3bd842fb03850a577b730ab8c63343bb1f468fd
    ports:
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9003:9001"
    environment:
      MINIO_ROOT_USER: ${BACKUP_S3_ACCESS_KEY_ID:?Set BACKUP_S3_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${BACKUP_S3_SECRET_ACCESS_KEY:?Set BACKUP_S3_SECRET_ACCESS_KEY in .env}
    command: server /data --console-address ":9001"
    volumes:
      - minio-backup-data:/data

  setup:
    profiles: [setup]
    image: pgsty/mc:RELEASE.2026-11-12T00-00-00Z@sha256:b532278b7a3747dbab6fe45eebb40a653efa704e6758e24e9d9ec54fc96c1800
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-backup:
        condition: service_healthy
    environment:
      - S3_ACCESS_KEY_ID
      - S3_SECRET_ACCESS_KEY
      - S3_BUCKET_NAME
      - BACKUP_S3_ACCESS_KEY_ID
      - BACKUP_S3_SECRET_ACCESS_KEY
      - BACKUP_S3_BUCKET_NAME
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set primary http://minio:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY"
        mc alias set backup http://minio-backup:9000 "$$BACKUP_S3_ACCESS_KEY_ID" "$$BACKUP_S3_SECRET_ACCESS_KEY"
        mc mb --ignore-existing "primary/$${S3_BUCKET_NAME:?}" "backup/$${BACKUP_S3_BUCKET_NAME:?}"

volumes:
  postgres-data:
  minio-data:
  minio-backup-data:
